<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio Ferreira Costa — Jerinana Café</title>
  <meta name="description" content="Cardápio da unidade Ferreira Costa do Jerinana Café — em breve." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/logo.svg" />
  <style>
    :root {
      --verde: #056F21;
      --branco: #FEFEFE;
      --cafe: #2C1A0E;
      --caramel: #B8742A;
      --areia: #E8D9BE;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cafe);
      color: var(--branco);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-image {
      position: fixed; inset: 0;
      background-image: url('/assets/cafe3.png');
      background-size: cover; background-position: center;
      filter: blur(22px) brightness(0.4);
      z-index: -2; transform: scale(1.1);
    }
    .bg-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(20,10,5,0.92) 0%, rgba(44,26,14,0.95) 100%);
      z-index: -1;
    }
    .page {
      max-width: 480px;
      width: 100%;
      padding: 40px 24px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      gap: 0;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      color: var(--areia); text-decoration: none;
      font-size: 13px; font-weight: 500;
      padding: 8px 14px; border-radius: 20px;
      border: 1px solid rgba(254,254,254,0.12);
      background: rgba(254,254,254,0.05);
      align-self: flex-start; margin-bottom: 48px;
      transition: all 0.25s ease;
    }
    .back-btn:hover { color: var(--branco); background: rgba(5,111,33,0.15); border-color: var(--verde); transform: translateX(-2px); }
    .logo-container {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--branco);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      border: 3px solid var(--verde);
      box-shadow: 0 0 30px rgba(5,111,33,0.25);
    }
    .logo-container img { height: 44px; width: auto; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 900;
      color: var(--branco); margin-bottom: 8px;
    }
    .unit {
      font-size: 13px; color: var(--caramel);
      font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 32px;
    }
    .coming-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 36px 28px;
      backdrop-filter: blur(12px);
      margin-bottom: 28px;
      width: 100%;
    }
    .coming-icon { font-size: 48px; margin-bottom: 16px; }
    .coming-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 700;
      color: var(--branco); margin-bottom: 10px;
    }
    .coming-desc {
      font-size: 13.5px;
      color: var(--areia); opacity: 0.75;
      line-height: 1.6;
    }
    .insta-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 22px;
      background: linear-gradient(135deg, rgba(131,58,180,0.14), rgba(225,48,108,0.14));
      border: 1px solid rgba(225,48,108,0.28);
      border-radius: 14px;
      text-decoration: none; color: var(--areia);
      font-size: 13.5px; font-weight: 600;
      transition: all 0.25s ease; width: 100%; justify-content: center;
    }
    .insta-btn:hover {
      background: linear-gradient(135deg, rgba(131,58,180,0.24), rgba(225,48,108,0.24));
      border-color: rgba(225,48,108,0.55);
      color: var(--branco); transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(225,48,108,0.18);
    }
    .insta-btn svg { color: #e1306c; }
    .footer { margin-top: 40px; text-align: center; display: flex; flex-direction: column; gap: 5px; }
    .footer-text { font-size: 12px; font-weight: 700; color: var(--caramel); letter-spacing: 0.06em; text-transform: uppercase; }
    .footer-sub { font-size: 11px; color: var(--areia); opacity: 0.45; }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="page">
    <a href="/cardapio" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Voltar</span>
    </a>
    <div class="logo-container">
      <img src="/assets/logo.svg" alt="Jerinana Logo" />
    </div>
    <h1>Cardápio</h1>
    <p class="unit">Ferreira Costa</p>
    <div class="coming-box">
      <div class="coming-icon">⏳</div>
      <h2 class="coming-title">Em breve!</h2>
      <p class="coming-desc">
        O cardápio completo desta unidade está sendo preparado com todo o carinho.<br><br>
        Acompanhe nossas redes para ficar por dentro das novidades!
      </p>
    </div>
    <a href="https://www.instagram.com/jerinana_/" target="_blank" rel="noopener" class="insta-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      <span>Siga @jerinana_ no Instagram</span>
    </a>
    <footer class="footer">
      <p class="footer-text">Feito com ☕ em Caruaru</p>
      <p class="footer-sub">© 2026 Jerinana Café. Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>
