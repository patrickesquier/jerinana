<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio — Jerinana Café</title>
  <meta name="description" content="Veja o cardápio completo do Jerinana Café. Escolha sua unidade." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="selector.css" />
  <link rel="icon" href="../assets/logo.svg" />
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="page">

    <a href="../" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Voltar</span>
    </a>

    <header class="header">
      <div class="logo-container">
        <img src="../assets/logo.svg" alt="Jerinana Logo" class="logo" />
      </div>
      <h1 class="title">Cardápio</h1>
      <p class="tagline">Selecione uma unidade</p>
    </header>

    <main class="cards">

      <a href="difusora/" class="unit-card" id="card-difusora">
        <div class="card-glow"></div>
        <div class="card-body">
          <div class="card-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <div class="card-info">
            <h2 class="card-name">Shopping Difusora</h2>
            <p class="card-desc">Almoço executivo, tapiocas, toasts e muito mais</p>
          </div>
          <div class="card-arrow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
        </div>
        <div class="card-tag">Ver Cardápio →</div>
      </a>

      <a href="ferreira/" class="unit-card coming-soon" id="card-ferreira">
        <div class="card-glow"></div>
        <div class="card-body">
          <div class="card-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <div class="card-info">
            <h2 class="card-name">Ferreira Costa</h2>
            <p class="card-desc">Cardápio em breve nesta unidade</p>
          </div>
          <div class="card-arrow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </div>
        </div>
        <div class="card-tag card-tag-soon">⏳ Em Breve</div>
      </a>

    </main>

    <a href="https://www.instagram.com/jerinana_/" target="_blank" rel="noopener" class="insta-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      <span>Siga @jerinana_ no Instagram</span>
    </a>

    <footer class="footer">
      <p class="footer-text">Feito com ☕ em Caruaru</p>
      <p class="footer-sub">© 2026 Jerinana Café. Todos os direitos reservados.</p>
    </footer>
  </div>
</body>
</html>
